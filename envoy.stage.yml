admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9091

overload_manager:
  resource_monitors:
    - name: "envoy.resource_monitors.global_downstream_max_connections"
      typed_config:
        "@type": "type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig"
        max_active_downstream_connections: 10000

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8082
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        # Public routes that don't require a token
                        - match:
                            prefix: "/auth"
                          route:
                            prefix_rewrite: "/"
                            cluster: auth_service_stage
                        - match:
                            prefix: "/static"
                          route:
                            prefix_rewrite: "/"
                            cluster: static_server_service_stage
                        - match:
                            prefix: "/spec"
                          route:
                            prefix_rewrite: "/"
                            cluster: spec_service_stage
                        - match:
                            prefix: "/admin"
                          route:
                            prefix_rewrite: "/"
                            cluster: admin_service_stage
                        - match:
                            prefix: "/snapshot"
                          route:
                            prefix_rewrite: "/"
                            cluster: snapshot_service_stage
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: grpc_service
      type: LOGICAL_DNS
      http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: grpc-service, port_value: 50051 }
    - name: admin_service_stage
      connect_timeout: 5s
      type: LOGICAL_DNS
      load_assignment:
        cluster_name: admin_service_stage
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: admin
                      port_value: 5011
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"
    - name: auth_service_stage
      connect_timeout: 5s
      type: LOGICAL_DNS
      # The 'auth' service name from docker-compose.
      load_assignment:
        cluster_name: auth_service_stage
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: auth # The 'auth' service name from docker-compose.
                      port_value: 5012
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"
    - name: spec_service_stage
      connect_timeout: 5s
      type: LOGICAL_DNS
      load_assignment:
        cluster_name: spec_service_stage
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: spec
                      port_value: 5013
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"
    - name: snapshot_service_stage
      connect_timeout: 5s
      type: LOGICAL_DNS
      load_assignment:
        cluster_name: snapshot_service_stage
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: snapshot
                      port_value: 5014
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: "/health"
    - name: static_server_service_stage
      connect_timeout: 5s
      type: LOGICAL_DNS
      load_assignment:
        cluster_name: static_server_service_stage
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: static-server
                      port_value: 5080
      health_checks:
        - timeout: 1s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          tcp_health_check: {}
