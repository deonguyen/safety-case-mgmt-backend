  auth:
    build:
      context: .
      dockerfile: sq_spec_portal_backend_auth_project/Dockerfile.stage
    container_name: sq-spec_portal-backend-auth-stage
    env_file:
      - sq_spec_portal_backend_auth_project/.env
    ports: # Port 5012 is exposed in Dockerfile.stage
      - "5012:5012"
    command: "python sq_spec_portal_backend_auth_project/manage.py runserver 0.0.0.0:5012"
    networks:
      - envoy-network

