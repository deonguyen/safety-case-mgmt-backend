  envoy:
    image: envoyproxy/envoy:v1.29-latest
    container_name: envoy-proxy-stage
    depends_on:
      # - static-server
      # - admin
      - auth
      # - spec
      # - snapshot
    ports:
      - "8082:8082" # HTTP Proxy
      - "9901:9901" # Admin
    volumes:
      - ./envoy.stage.yml:/etc/envoy/envoy.yaml:ro
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --service-cluster sq-spec-portal-backend-backend-cluster-stage
    networks:
      - envoy-network

networks:
  envoy-network:
    driver: bridge

volumes:
  static_volume:
    driver: local