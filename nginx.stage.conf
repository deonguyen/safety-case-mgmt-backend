server {
    listen 5080;
    server_name _;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    location /health {
        access_log off;                 # Suppress health check floods in your access logs
        add_header Content-Type text/plain;
        return 200 'OK';               # Immediately return a 200 status code
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
