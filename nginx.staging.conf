server {
    listen 5080;
    server_name _;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    location = /health/ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
