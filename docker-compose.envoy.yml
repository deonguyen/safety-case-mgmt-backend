services:
  static-server:
    image: nginx:1.25-alpine
    container_name: static-server-dev
    ports:
      - "5080:5080"
    volumes:
      - static_volume:/usr/src/app/staticfiles:ro
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - envoy-network

  admin:
    build:
      context: .
      dockerfile: sq_spec_portal_backend_admin_project/Dockerfile.dev
    container_name: sq-spec-portal-backend-admin-dev
    volumes:
      - static_volume:/usr/src/app/staticfiles
    env_file:
      - sq_spec_portal_backend_admin_project/.env.dev
    ports:
      - "5001:5001"
    command: >
      sh -c "python sq_spec_portal_backend_admin_project/manage.py collectstatic --noinput && python sq_spec_portal_backend_admin_project/manage.py runserver 0.0.0.0:5001"
    networks:
      - envoy-network

  auth:
    build:
      context: .
      # Assuming a production Dockerfile exists here
      dockerfile: sq_spec_portal_backend_auth_project/Dockerfile.dev
    container_name: sq-spec-portal-backend-auth-dev
    env_file:
      - sq_spec_portal_backend_auth_project/.env.dev
    ports:
      - "5002:5002"
    command: "python sq_spec_portal_backend_auth_project/manage.py runserver 0.0.0.0:5002"
    networks:
      - envoy-network

  spec:
    build:
      context: .
      # Assuming a production Dockerfile exists here
      dockerfile: sq_spec_portal_backend_spec_project/Dockerfile.dev
    container_name: sq-spec-portal-backend-spec-dev
    env_file:
      - sq_spec_portal_backend_spec_project/.env.dev
    ports:
      - "5003:5003"
    command: "python sq_spec_portal_backend_spec_project/manage.py runserver 0.0.0.0:5003"
    networks:
      - envoy-network

  snapshot:
    build:
      context: .
      # Assuming a production Dockerfile exists here
      dockerfile: sq_spec_portal_backend_snapshot_project/Dockerfile.dev
    container_name: sq-spec-portal-backend-snapshot-dev
    env_file:
      - sq_spec_portal_backend_snapshot_project/.env.dev
    ports:
      - "5004:5004"
    command: "python sq_spec_portal_backend_snapshot_project/manage.py runserver 0.0.0.0:5004"
    networks:
      - envoy-network

  envoy:
    image: envoyproxy/envoy:v1.29-latest # Match the version used in eks-deployment.yml
    container_name: envoy-proxy-dev
    depends_on:
      - static-server
      - admin
      - auth
      - spec
      - snapshot
    ports: # The port was already 8082, which is fine.
      - "8082:8082" # HTTP Proxy
      - "9901:9901" # Admin
    volumes: # Use a production-like envoy config
      - ./envoy.dev.yml:/etc/envoy/envoy.yaml:ro
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --service-cluster sq-spec-portal-backend-backend-cluster-dev
    networks:
      - envoy-network

networks:
  envoy-network:
    driver: bridge

volumes:
  static_volume:
    driver: local
